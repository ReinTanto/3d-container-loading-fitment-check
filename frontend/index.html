<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' rx='2' fill='%2346b3f0'/%3E%3C/svg%3E" />
<title>3D Container Loading — Fitment Check</title>
<style>
  :root {
    /* one ground, one ink, one accent; surfaces separated by tone, never a line */
    --bg: #10181d;          /* 3D canvas ground */
    --panel: #18242b;       /* left panel */
    --surface: #223139;     /* raised surface (cards, buttons) */
    --surface-2: #2c3d47;   /* hover / focus step */
    --field: #3a4b57;       /* input background — lighter, stands out from cards */
    --field-focus: #46586a; /* input focus step */
    --text: #e9eff2;        /* ink — running text at full strength */
    --muted: #93a7b2;       /* secondary notes only */
    --accent: #46b3f0;
    --ok: #6cc06f;
    --bad: #f0655f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: 384px 1fr;
    height: 100dvh;
    overflow: hidden;
  }
  /* ---------- Left panel ---------- */
  #panel {
    background: var(--panel);
    padding: 22px 20px;
    overflow-y: auto;
  }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; line-height: 1.4; }
  .section-title {
    font-size: 14px; font-weight: 600; color: var(--text); margin: 24px 0 10px;
  }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  input, select {
    width: 100%; background: var(--field); color: var(--text);
    border-radius: 8px; padding: 9px 11px; font-size: 14px;
    outline: none; border: none; appearance: none; -webkit-appearance: none;
    box-shadow: none; transition: background .15s;
  }
  input:focus, select:focus { background: var(--field); }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .product {
    background: var(--surface);
    border-radius: 10px; padding: 12px; margin-bottom: 12px; position: relative;
  }
  .product .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .product .swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; margin-right: 8px; vertical-align: middle; }
  .product .name { font-size: 14px; font-weight: 600; }
  .btn {
    background: var(--accent); color: #08131a; border: none; border-radius: 8px;
    padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: transform .12s, filter .15s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .btn.secondary { background: var(--surface); color: var(--text); }
  .btn.danger { background: transparent; color: #ff9a94; padding: 4px 9px; font-size: 13px; }
  .actions { display: flex; gap: 8px; margin-top: 18px; }
  .actions .btn { flex: 1; }
  /* ---------- Result ---------- */
  #result { margin-top: 20px; display: none; }
  #result.show { display: block; }
  .badge {
    display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 14px;
    font-weight: 700; margin-bottom: 14px;
  }
  .badge.ok { background: rgba(108,192,111,.16); color: var(--ok); }
  .badge.bad { background: rgba(240,101,95,.16); color: var(--bad); }
  .stat { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; gap: 12px; }
  .stat .k { color: var(--muted); }
  .bar { height: 8px; border-radius: 4px; background: var(--surface); overflow: hidden; margin: 10px 0 6px; }
  .bar > div { height: 100%; background: var(--accent); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .legend .item { display: flex; align-items: center; font-size: 13px; color: var(--muted); }
  /* ---------- 3D view ---------- */
  #view { position: relative; }
  #view canvas { display: block; }
  #hud {
    position: absolute; top: 14px; left: 14px; background: rgba(0,0,0,.5);
    padding: 9px 13px; border-radius: 8px; font-size: 13px; color: var(--text);
    pointer-events: none; max-width: 340px; line-height: 1.4;
  }
  #hud b { color: var(--accent); }
  #tooltip {
    position: absolute; display: none; background: rgba(0,0,0,.78); color: #fff;
    padding: 7px 11px; border-radius: 7px; font-size: 13px; pointer-events: none;
    transform: translate(-50%, -140%); white-space: nowrap; z-index: 5;
  }
  .hint { position: absolute; bottom: 14px; left: 14px; font-size: 13px; color: var(--muted); pointer-events: none; }
  /* ---------- responsive: stack panel above the 3D view on narrow screens ---------- */
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow-y: auto; }
    #panel { overflow: visible; }
    #view { min-height: 60vh; }
  }
  /* ---------- motion (transform + opacity only, reduced-motion safe) ---------- */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: no-preference) {
    #panel > * { animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
    #panel > *:nth-child(2) { animation-delay: .06s; }
    #panel > *:nth-child(3) { animation-delay: .12s; }
    #panel > *:nth-child(4) { animation-delay: .18s; }
    #panel > *:nth-child(5) { animation-delay: .24s; }
    #panel > *:nth-child(6) { animation-delay: .30s; }
  }
</style>

<body>
  <!-- ================= LEFT PANEL ================= -->
  <div id="panel">
    <h1>3D Container Loading</h1>
    <div class="sub">Fitment check + visualization</div>

    <div class="section-title">Container</div>
    <div class="grid-3">
      <div><label>Length</label><input id="c-len" type="number" value="1200" min="1" /></div>
      <div><label>Width</label><input id="c-wid" type="number" value="235" min="1" /></div>
      <div><label>Height</label><input id="c-hei" type="number" value="235" min="1" /></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div><label>Max weight (optional)</label><input id="c-weight" type="number" placeholder="e.g. 24000" min="0" /></div>
    </div>

    <div class="section-title">Products</div>
    <div id="products"></div>
    <button class="btn secondary" id="add-product" style="width:100%">+ Add product</button>

    <div class="actions">
      <button class="btn" id="check-btn">Calculate &amp; visualize</button>
    </div>

    <div id="result">
      <div id="result-badge"></div>
      <div id="result-stats"></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <!-- ================= 3D VIEW ================= -->
  <div id="view">
    <div id="hud">Enter a container and products, then press <b>Calculate</b>.</div>
    <div id="tooltip"></div>
    <div class="hint">Drag to rotate · Scroll to zoom · Right-drag to pan · Double-click to reset view</div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* ============================================================
   Scene setup (mirrors skjolber/3d-bin-container-packing viewer)
   ============================================================ */
const view = document.getElementById("view");
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(80, 1, 0.1, 100000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setClearColor("#263238");
view.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.25;
controls.enableZoom = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(1, 2, 1);
scene.add(dirLight);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = null;

// Groups we rebuild on each calculation
let contentGroup = null;
let gridGroup = null;
const boxMeshes = [];       // for raycasting / hover
let containerSize = null;   // for camera fit
let hasComputed = false;    // idle sample shows until the first real /check

/* ---------- helpers ---------- */
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener("resize", resize);

function fitCameraToBox(box, offset = 1.5) {
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const fov = camera.fov * (Math.PI / 180);
  const camZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * offset;
  camera.position.set(center.x - camZ * 0.2, center.y + camZ * 0.55, center.z + camZ);
  camera.lookAt(center);
  controls.target.copy(center);
  controls.update();
}

/* ---------- build a container shell (transparent box + edges) ---------- */
function buildContainer(len, wid, hei) {
  // three.js (X, Y, Z) = (length, height, width) — SAME mapping as the boxes,
  // so the shell and the boxes align.
  const geo = new THREE.BoxGeometry(len, hei, wid);
  const group = new THREE.Group();

  const shell = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
    color: 0x888888, opacity: 0.12, transparent: true, depthWrite: false
  }));
  shell.position.set(len / 2, hei / 2, wid / 2); // center the corner-at-origin geometry
  group.add(shell);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: 0x9aa7ad })
  );
  edges.position.set(len / 2, hei / 2, wid / 2);
  group.add(edges);
  return group;
}

/* ---------- build one box mesh ---------- */
function buildBox(p, color) {
  // three.js (X, Y, Z) = (dx, dz, dy) = (length, height, width)
  const geo = new THREE.BoxGeometry(p.dx, p.dz, p.dy);
  const mat = new THREE.MeshStandardMaterial({
    color, opacity: 0.72, metalness: 0.15, roughness: 0.9, transparent: true
  });
  mat.color.convertSRGBToLinear();
  const mesh = new THREE.Mesh(geo, mat);
  // solver (x, y, z) = (length, width, height) -> three.js (X, Y, Z) = (x, z, y)
  mesh.position.set(p.x + p.dx / 2, p.z + p.dz / 2, p.y + p.dy / 2);
  // edge outline
  mesh.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: 0x10151a })
  ));
  mesh.userData = {
    type: "box",
    name: p.name,
    unit: p.unit,
    pos: [p.x, p.y, p.z],
    dims: [p.dx, p.dy, p.dz],
  };
  return mesh;
}

/* ---------- ground grid + axes, centered at the origin ---------- */
function buildGrid(maxLen, maxWid, spacing = 10) {
  const g = new THREE.Group();
  const size = Math.max(maxLen, maxWid) + spacing * 3;
  const grid = new THREE.GridHelper(size, size / spacing, 0x42a5f5, 0x2f4a5a);
  g.add(grid); // GridHelper is already centered at its origin
  g.add(new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0), maxLen + spacing, 0xffffff, 1, 1));
  g.add(new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 0), maxWid + spacing, 0xffffff, 1, 1));
  g.add(new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0), 40, 0x888888, 1, 1));
  return g;
}

/* ---------- clear previous content ---------- */
function clearContent() {
  if (contentGroup) { scene.remove(contentGroup); contentGroup.traverse(o => o.geometry && o.geometry.dispose()); }
  if (gridGroup) { scene.remove(gridGroup); }
  contentGroup = null; gridGroup = null; boxMeshes.length = 0;
  if (hovered) { hovered.material.emissive.set(0x000000); hovered = null; }
}

/* ============================================================
   Render a /check response
   ============================================================ */
function renderResult(res) {
  clearContent();
  contentGroup = new THREE.Group();

  const len = res._box.length, wid = res._box.width, hei = res._box.height;
  containerSize = [len, hei, wid]; // three.js (x, y, z) of the container
  const container = buildContainer(len, wid, hei);
  contentGroup.add(container);

  // one mesh per placed unit, colored by product
  for (const pl of res.placements) {
    const color = res._colorMap[pl.product_id] || 0x42a5f5;
    const mesh = buildBox(pl, color);
    contentGroup.add(mesh);
    boxMeshes.push(mesh);
  }

  // Center the whole container (and its boxes) on the grid at the origin.
  contentGroup.position.set(-len / 2, 0, -wid / 2);

  scene.add(contentGroup);

  // grid + camera
  gridGroup = buildGrid(len, wid);
  scene.add(gridGroup);
  fitCameraToBox(new THREE.Box3(
    new THREE.Vector3(-len / 2, 0, -wid / 2),
    new THREE.Vector3(len / 2, hei, wid / 2)
  ), 1.5);

  // Client-side collision + containment check (independent of the API).
  const collision = checkCollisions(res);
  res._collision = collision;

  updateHUD(res);
  updateResultPanel(res);
}

/* ---------- client-side collision & containment check ----------
   Verifies, from the returned placements alone, that (a) no two placed
   boxes overlap and (b) every box lies inside the container. This is an
   independent sanity check on top of the solver's own guarantees. */
function checkCollisions(res) {
  const eps = 1e-6;
  const B = res._box;
  const P = res.placements;
  let overlapPairs = 0;
  let outOfBounds = 0;
  // containment
  for (const p of P) {
    if (
      p.x < -eps || p.y < -eps || p.z < -eps ||
      p.x + p.dx > B.length + eps ||
      p.y + p.dy > B.width + eps ||
      p.z + p.dz > B.height + eps
    ) outOfBounds++;
  }
  // pairwise overlap (AABB)
  for (let i = 0; i < P.length; i++) {
    const a = P[i];
    for (let j = i + 1; j < P.length; j++) {
      const b = P[j];
      const separated =
        a.x + a.dx <= b.x + eps || b.x + b.dx <= a.x + eps ||
        a.y + a.dy <= b.y + eps || b.y + b.dy <= a.y + eps ||
        a.z + a.dz <= b.z + eps || b.z + b.dz <= a.z + eps;
      if (!separated) overlapPairs++;
    }
  }
  return { overlapPairs, outOfBounds, ok: overlapPairs === 0 && outOfBounds === 0 };
}

/* ============================================================
   UI: products form
   ============================================================ */
const productsEl = document.getElementById("products");
let productCount = 0;
const colorPalette = ["#42a5f5","#66bb6a","#ffa726","#ab47bc","#ef5350","#26c6da","#d4e157","#8d6e63","#78909c","#ec407a"];

function addProduct(prefill = {}) {
  productCount++;
  const color = colorPalette[(productCount - 1) % colorPalette.length];
  const el = document.createElement("div");
  el.className = "product";
  el.innerHTML = `
    <div class="head">
      <div><span class="swatch" style="background:${color}"></span><span class="name">Product ${productCount}</span></div>
      <button class="btn danger" type="button">remove</button>
    </div>
    <div class="row">
      <div style="flex:1"><label>Name</label><input class="p-name" type="text" value="${prefill.name || "product"}" /></div>
    </div>
    <div class="grid-3">
      <div><label>L</label><input class="p-l" type="number" value="${prefill.l ?? 120}" min="1" /></div>
      <div><label>W</label><input class="p-w" type="number" value="${prefill.w ?? 80}" min="1" /></div>
      <div><label>H</label><input class="p-h" type="number" value="${prefill.h ?? 100}" min="1" /></div>
    </div>
    <div class="grid-2" style="margin-top:8px">
      <div><label>Quantity</label><input class="p-q" type="number" value="${prefill.q ?? 1}" min="1" /></div>
      <div><label>Weight (opt.)</label><input class="p-weight" type="number" placeholder="kg" min="0" /></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div><label>Orientation</label>
        <select class="p-orient">
          <option value="any" ${prefill.orient === "any" ? "selected" : ""}>Any (can be rotated / on its side)</option>
          <option value="fixed" ${prefill.orient === "fixed" ? "selected" : ""}>Fixed (must stay upright)</option>
        </select>
      </div>
    </div>
  `;
  el.querySelector(".danger").addEventListener("click", () => {
    if (productsEl.children.length > 1) el.remove();
  });
  productsEl.appendChild(el);
}

document.getElementById("add-product").addEventListener("click", () => addProduct());

/* seed with a couple of example products */
addProduct({ name: "pallet", l: 120, w: 80, h: 100, q: 30 });
addProduct({ name: "parcel", l: 60, w: 40, h: 40, q: 10 });

function collectRequest() {
  const box = {
    length: parseFloat(document.getElementById("c-len").value),
    width: parseFloat(document.getElementById("c-wid").value),
    height: parseFloat(document.getElementById("c-hei").value),
  };
  const mw = document.getElementById("c-weight").value;
  if (mw) box.max_weight = parseFloat(mw);

  const products = [];
  for (const el of productsEl.children) {
    const w = el.querySelector(".p-weight").value;
    products.push({
      id: el.querySelector(".p-name").value || "product",
      length: parseFloat(el.querySelector(".p-l").value),
      width: parseFloat(el.querySelector(".p-w").value),
      height: parseFloat(el.querySelector(".p-h").value),
      quantity: parseInt(el.querySelector(".p-q").value, 10),
      orientation: el.querySelector(".p-orient").value,
      ...(w ? { weight: parseFloat(w) } : {}),
    });
  }
  return { box, products };
}

/* ============================================================
   Call the API
   ============================================================ */
// The API base URL. Default to the FastAPI server on localhost:8000.
// If the page is served by the API itself (same origin), use that origin.
const DEFAULT_API = "http://localhost:8000";
const API = (location.protocol === "http:" || location.protocol === "https:")
  ? (location.port === "8000" ? location.origin : DEFAULT_API)
  : DEFAULT_API;

async function runCheck() {
  const req = collectRequest();
  hasComputed = true;
  document.getElementById("hud").innerHTML = "Calculating…";
  try {
    const r = await fetch(API + "/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(req),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || ("HTTP " + r.status));
    data._box = req.box;
    // total volume of ALL requested products (the "requested" volume)
    data.products_total_volume = req.products.reduce(
      (s, p) => s + p.length * p.width * p.height * p.quantity, 0
    );
    // assign a stable color per product id
    data._colorMap = {};
    const seen = [];
    for (const p of req.products) {
      if (!seen.includes(p.id)) seen.push(p.id);
    }
    seen.forEach((id, i) => {
      data._colorMap[id] = new THREE.Color(colorPalette[i % colorPalette.length]).getHex();
    });
    renderResult(data);
  } catch (e) {
    document.getElementById("hud").innerHTML =
      `Error: ${e.message}<br><span style="color:var(--muted)">Is the API running at ${API}?</span>`;
  }
}
document.getElementById("check-btn").addEventListener("click", runCheck);

/* ============================================================
   Result panel + legend
   ============================================================ */
function updateResultPanel(res) {
  const el = document.getElementById("result");
  el.classList.add("show");
  const badge = document.getElementById("result-badge");
  badge.className = "badge " + (res.fits ? "ok" : "bad");
  badge.textContent = res.fits ? "Fits" : "Does not fit";

  // "Requested" = total volume of ALL the products you entered.
  // "Placed"    = volume of the units that actually fit (what's really in the container).
  // They differ when the load does not fit (waste / geometry).
  const requestedVol = res.products_total_volume; // computed in runCheck
  const rows = [
    ["Units placed", `${res.units_placed} / ${res.units_total}`],
    ["Box volume", fmt(res.box_volume)],
  ];
  if (res.fits) {
    rows.push(
      ["Volume used", fmt(res.used_volume)],
      ["Remaining volume", fmt(res.remaining_volume)],
      ["Remaining %", res.remaining_volume_pct.toFixed(2) + " %"],
    );
  } else {
    rows.push(
      ["Requested volume", `${fmt(requestedVol)} (${(100 * requestedVol / res.box_volume).toFixed(1)}% of box)`],
      ["Volume actually placed", `${fmt(res.used_volume)} (${res.used_volume_pct.toFixed(1)}% of box)`],
      ["Did not fit", res.first_unplaced ? `${res.first_unplaced.product_id} #${res.first_unplaced.unit}` : "—"],
    );
  }
  if (res.max_weight != null) {
    rows.push(["Weight", `${fmt(res.total_weight)} / ${fmt(res.max_weight)} ${res.weight_ok ? "" : "(over)"}`]);
  }
  if (res._collision) {
    const c = res._collision;
    rows.push(["Collision check", c.ok ? "No overlaps, all in bounds" : `${c.overlapPairs} overlaps / ${c.outOfBounds} out-of-bounds`]);
  }
  const statsEl = document.getElementById("result-stats");
  // clear any bar/caption left over from a previous run
  statsEl.parentElement.querySelectorAll(".bar, .bar-caption").forEach(n => n.remove());
  statsEl.innerHTML = rows
    .map(([k, v]) => `<div class="stat"><span class="k">${k}</span><span>${v}</span></div>`).join("");

  // utilization bar — always shows what is ACTUALLY in the container
  const bar = document.createElement("div");
  bar.className = "bar";
  bar.innerHTML = `<div style="width:${res.used_volume_pct.toFixed(1)}%"></div>`;
  statsEl.after(bar);
  const cap = document.createElement("div");
  cap.className = "bar-caption";
  cap.style.cssText = "font-size:11px;color:var(--muted);margin-bottom:8px";
  cap.textContent = res.fits
    ? `Container ${res.used_volume_pct.toFixed(1)}% full`
    : `Only ${res.used_volume_pct.toFixed(1)}% of the container is filled (requested ${(100 * requestedVol / res.box_volume).toFixed(1)}%)`;
  bar.after(cap);

  // legend
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  for (const [id, hex] of Object.entries(res._colorMap)) {
    const item = document.createElement("div");
    item.className = "item";
    item.innerHTML = `<span class="swatch" style="background:#${new THREE.Color(hex).getHexString()};margin-right:5px"></span>${id}`;
    legend.appendChild(item);
  }
}
function fmt(n) { return (Math.round(n * 100) / 100).toLocaleString(); }

function updateHUD(res) {
  const c = res._collision;
  const collisionLine = c
    ? (c.ok ? "· no collisions" : `· <span style="color:var(--bad)">${c.overlapPairs} overlaps, ${c.outOfBounds} out-of-bounds</span>`)
    : "";
  document.getElementById("hud").innerHTML =
    `${res.fits ? "Fits" : "Does not fit"} · ${res.units_placed}/${res.units_total} units · ` +
    `${res.remaining_volume_pct.toFixed(1)}% space left ${collisionLine}`;
}

/* ============================================================
   Hover highlight + tooltip
   ============================================================ */
const tooltip = document.getElementById("tooltip");
view.addEventListener("mousemove", (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(boxMeshes, false);
  let target = null;
  for (const h of hits) {
    let o = h.object, vis = true;
    while (o) { if (!o.visible) { vis = false; break; } o = o.parent; }
    if (vis) { target = h.object; break; }
  }
  if (target !== hovered) {
    if (hovered) hovered.material.emissive.set(0x000000);
    hovered = target;
    if (hovered) hovered.material.emissive.set(0x552222);
  }
  if (hovered) {
    const d = hovered.userData;
    tooltip.style.display = "block";
    tooltip.style.left = (e.clientX - view.getBoundingClientRect().left) + "px";
    tooltip.style.top = (e.clientY - view.getBoundingClientRect().top) + "px";
    tooltip.innerHTML = `<b>${d.name}</b> #${d.unit}<br>at ${d.pos.map(n => Math.round(n)).join(", ")}<br>${d.dims.map(n => Math.round(n)).join(" × ")}`;
  } else {
    tooltip.style.display = "none";
  }
});
view.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
view.addEventListener("dblclick", () => {
  if (containerSize) fitCameraToBox(new THREE.Box3(
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(containerSize[0], containerSize[1], containerSize[2])
  ), 1.5);
});

/* ---------- idle sample: a 3D load so the view is never blank ----------
   Shows a static sample of the default form (40 ft container, pallets)
   until the user runs a real calculation. The user can still orbit it
   manually with the mouse. */
function showIdleSample() {
  if (hasComputed) return;
  const len = 1200, wid = 235, hei = 235;
  containerSize = [len, hei, wid];
  clearContent();
  contentGroup = new THREE.Group();
  contentGroup.add(buildContainer(len, wid, hei));
  // sample placements: a 10 x 2 grid of pallets (120 x 80 x 100)
  for (let i = 0; i < 10; i++) {
    for (let j = 0; j < 2; j++) {
      contentGroup.add(buildBox({
        name: "pallet", unit: i * 2 + j + 1,
        x: i * 120, y: j * 80, z: 0, dx: 120, dy: 80, dz: 100,
      }, 0x42a5f5));
    }
  }
  contentGroup.position.set(-len / 2, 0, -wid / 2);
  scene.add(contentGroup);
  gridGroup = buildGrid(len, wid);
  scene.add(gridGroup);
  fitCameraToBox(new THREE.Box3(
    new THREE.Vector3(-len / 2, 0, -wid / 2),
    new THREE.Vector3(len / 2, hei, wid / 2)
  ), 1.6);
  document.getElementById("hud").innerHTML =
    `Sample load · <b>Calculate</b> with your own container and products`;
}

/* ---------- animate loop ---------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
resize();
showIdleSample();
animate();
</script>
